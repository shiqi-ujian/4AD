// BFS pathfinding along hex grid — returns array of {q,r} from start to goal (inclusive)
function hexPathfind(q1, r1, q2, r2) {
  if (q1 === q2 && r1 === r2) return [{ q: q1, r: r1 }];
  const startKey = hexKey(q1, r1);
  const goalKey = hexKey(q2, r2);
  const visited = new Set([startKey]);
  const queue = [{ q: q1, r: r1, path: [{ q: q1, r: r1 }] }];
  while (queue.length > 0) {
    const cur = queue.shift();
    for (const n of neighbors(cur.q, cur.r)) {
      const nk = hexKey(n.q, n.r);
      if (nk === goalKey) return [...cur.path, { q: n.q, r: n.r }];
      if (!visited.has(nk)) {
        visited.add(nk);
        queue.push({ q: n.q, r: n.r, path: [...cur.path, { q: n.q, r: n.r }] });
      }
    }
  }
  return null; // no path found
}

// ======== One-Click Map Generation ========

// Mulberry32 PRNG — deterministic, seedable
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Perlin noise — permutation table
let _perm = new Uint8Array(512);
function initPerm(seed) {
  const rng = mulberry32(seed);
  const p = [...Array(256).keys()];
  // Fisher-Yates shuffle
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) _perm[i] = p[i & 255];
}

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + t * (b - a); }
function grad2D(hash, x, y) {
  const h = hash & 3;
  const u = h < 2 ? x : y;
  const v = h < 2 ? y : x;
  return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
}

function noise2D(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  const aa = _perm[_perm[X] + Y], ab = _perm[_perm[X] + Y + 1];
  const ba = _perm[_perm[X + 1] + Y], bb = _perm[_perm[X + 1] + Y + 1];
  return lerp(
    lerp(grad2D(aa, xf, yf), grad2D(ba, xf - 1, yf), u),
    lerp(grad2D(ab, xf, yf - 1), grad2D(bb, xf - 1, yf - 1), u),
    v
  );
}

function fractalNoise(x, y, octaves) {
  let value = 0, amp = 1, freq = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    value += amp * noise2D(x * freq, y * freq);
    max += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return value / max; // -1..1
}

// Generate terrain for a bounded region
function generateTerrainRegion(seed, centerQ, centerR, width, height, scale) {
  initPerm(seed);
  const rng = mulberry32(seed + 1);
  const halfW = Math.floor(width / 2);
  const halfH = Math.floor(height / 2);
  const allTerrains = getAllTerrains();
  const ids = [];

  for (let q = centerQ - halfW; q <= centerQ + halfW; q++) {
    for (let r = centerR - halfH; r <= centerR + halfH; r++) {
      ids.push({ q, r });
    }
  }

  // Shuffle for varied processing order (avoids bias)
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }

  for (const { q, r } of ids) {
    const p = hexToPixel(q, r);
    const nx = p.x * 0.005 / scale;
    const ny = p.y * 0.005 / scale;

    const elev = fractalNoise(nx, ny, 4);
    const moist = fractalNoise(nx + 100, ny + 100, 3);

    let terrainId;
    if (elev < -0.20) {
      terrainId = 'water';
    } else if (elev > 0.50 && moist < -0.05) {
      terrainId = 'snow';
    } else if (elev > 0.40) {
      terrainId = 'mountain';
    } else if (elev > 0.20) {
      terrainId = 'hill';
    } else if (moist < -0.15) {
      terrainId = 'desert';
    } else if (moist > 0.15 && elev < 0.30) {
      terrainId = 'forest';
    } else if (elev < -0.05 && moist > 0.10) {
      terrainId = 'swamp';
    } else {      terrainId = 'plain';
    }

    // 5% chance of special terrain
    if (rng() < 0.05) {
      const specials = ['ruins', 'temple', 'abyss', 'necromantic'].filter(s => allTerrains[s]);
      if (specials.length > 0) terrainId = specials[Math.floor(rng() * specials.length)];
    }

    setHex(q, r, { terrain: terrainId });
  }
}

// A* pathfinding with terrain travel cost
function aStarPathfind(q1, r1, q2, r2) {
  if (q1 === q2 && r1 === r2) return [{ q: q1, r: r1 }];
  const startKey = hexKey(q1, r1);
  const goalKey = hexKey(q2, r2);
  const allTerrains = getAllTerrains();

  const openSet = new Set([startKey]);
  const cameFrom = {};
  const gScore = {}; gScore[startKey] = 0;
  const h = (q, r) => hexDistance(q, r, q2, r2);
  const fScore = {}; fScore[startKey] = h(q1, r1);

  while (openSet.size > 0) {
    // Find node in openSet with lowest fScore
    let current = null, bestF = Infinity;
    for (const key of openSet) {
      if (fScore[key] !== undefined && fScore[key] < bestF) {
        bestF = fScore[key];
        current = key;
      }
    }
    if (!current) break;
    if (current === goalKey) {
      // Reconstruct path
      const path = [];
      let c = current;
      while (c) {
        const [cq, cr] = c.split(',').map(Number);
        path.unshift({ q: cq, r: cr });
        c = cameFrom[c];
      }
      return path;
    }

    openSet.delete(current);
    const [cq, cr] = current.split(',').map(Number);

    for (const n of neighbors(cq, cr)) {
      const nk = hexKey(n.q, n.r);
      const hData = getHex(n.q, n.r);
      const tInfo = hData.terrain ? allTerrains[hData.terrain] : null;
      const moveCost = tInfo ? tInfo.travel : 1;
      // Water is nearly impassable avoid roads through water
      const waterPenalty = hData.terrain === 'water' ? 10 : 0;
      const totalCost = moveCost + waterPenalty;

      const tentativeG = gScore[current] + totalCost;
      if (gScore[nk] === undefined || tentativeG < gScore[nk]) {
        cameFrom[nk] = current;
        gScore[nk] = tentativeG;
        fScore[nk] = tentativeG + h(n.q, n.r);
        openSet.add(nk);
      }
    }
  }
  return null; // no path
}

// Score a hex for settlement placement
function rankSettlementLocation(q, r) {
  const h = getHex(q, r);
  if (!h.terrain) return -Infinity;
  if (h.terrain === 'water' || h.terrain === 'mountain') return -Infinity;

  let score = 0;
  if (h.terrain === 'plain') score += 10;
  else if (h.terrain === 'hill') score += 5;
  else if (h.terrain === 'forest') score += 4;
  else if (h.terrain === 'swamp' || h.terrain === 'desert') score -= 5;
  else if (h.terrain === 'snow') score -= 10;

  // Water proximity
  const nbrs = neighbors(q, r);
  for (const n of nbrs) {
    const nh = getHex(n.q, n.r);
    if (nh.terrain === 'water') score += 6;
    if (nh.terrain && (nh.terrain === 'temple' || nh.terrain === 'ruins')) score += 3;
  }

  // Penalty for mountains nearby
  for (const n of nbrs) {
    const nh = getHex(n.q, n.r);
    if (nh.terrain === 'mountain') score -= 4;
  }

  // Distance from other settlements
  for (const [key, data] of Object.entries(hexData)) {
    if (data.settlement) {
      const [sq, sr] = key.split(',').map(Number);
      const dist = hexDistance(q, r, sq, sr);
      if (dist < 4) score -= (4 - dist) * 15;
      if (dist < 2) score -= 100; // way too close
    }
  }

  return score;
}

// Place settlements using greedy scoring
function placeSettlements(count, _seed, centerQ, centerR, width, height) {
  const halfW = Math.floor(width / 2);
  const halfH = Math.floor(height / 2);
  const rng = mulberry32(_seed + 2);
  const candidates = [];

  for (let q = centerQ - halfW; q <= centerQ + halfW; q++) {
    for (let r = centerR - halfH; r <= centerR + halfH; r++) {
      const key = hexKey(q, r);
      if (!hexData[key]) continue;
      const score = rankSettlementLocation(q, r);
      if (score > -Infinity) candidates.push({ q, r, score });
    }
  }

  candidates.sort((a, b) => b.score - a.score);

  const placed = [];
  for (const cand of candidates) {
    if (placed.length >= count) break;
    let tooClose = false;
    for (const p of placed) {
      if (hexDistance(cand.q, cand.r, p.q, p.r) < 4) { tooClose = true; break; }
    }
    if (!tooClose) {
      const ratingMap = { 0: -3, 1: -2, 2: -1, 3: 0, 4: 1, 5: 2, 6: 3 };
      // Use the existing randomName function and generate rating based on d6
      // But we're deterministic so use rng() * 6;
      const d6 = Math.floor(rng() * 6 + 1);
      const rating = ratingMap[d6] || 0;
      const name = randomName();
      setHex(cand.q, cand.r, { settlement: { name, rating } });
      placed.push({ q: cand.q, r: cand.r });
    }
  }

  return placed;
}

// Build road network using A* + Minimum Spanning Tree (Prim's)
function buildRoadNetwork(settlements) {
  if (settlements.length < 2) return 0;

  // Compute A* path costs between all pairs
  const n = settlements.length;
  const edges = [];

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const path = aStarPathfind(settlements[i].q, settlements[i].r, settlements[j].q, settlements[j].r);
      if (path) {
        const cost = path.length;
        edges.push({ i, j, cost, path });
      }
    }
  }

  // Prim's algorithm for MST
  const visited = new Set([0]);
  const mstEdges = [];
  while (visited.size < n) {
    let best = null;
    for (const e of edges) {
      const inVisited = visited.has(e.i);
      const outVisited = visited.has(e.j);
      if (inVisited && !outVisited || !inVisited && outVisited) {
        if (!best || e.cost < best.cost) best = e;
      }
    }
    if (!best) break;
    mstEdges.push(best);
    visited.add(best.i);
    visited.add(best.j);
  }

  let roadsBuilt = 0;
  for (const e of mstEdges) {
    for (let k = 0; k < e.path.length - 1; k++) {
      addRoad(e.path[k].q, e.path[k].r, e.path[k + 1].q, e.path[k + 1].r);
      roadsBuilt++;
    }
  }
  return roadsBuilt;
}

// One-click generate orchestrator
function oneClickGenerate(config) {
  if (isGenerating) return;
  isGenerating = true;
  setGenButtonsDisabled(true);

  const { seed, width, height, scale, settlementCount, buildRoads, pos } = config;

  let centerQ = 0, centerR = 0;
  if (pos === 'center' && selectedHex) {
    centerQ = selectedHex.q;
    centerR = selectedHex.r;
  }

  showDiceResult('🏗️', `生成地形中 (${width}×${height})...`);

  setTimeout(() => {
    beginBatch();

    // Step 1: Generate terrain
    generateTerrainRegion(seed, centerQ, centerR, width, height, scale);
    render();

    showDiceResult('🏘️', '放置定居点...');

    setTimeout(() => {
      // Step 2: Place settlements
      const settlements = placeSettlements(settlementCount, seed + 1, centerQ, centerR, width, height);
      render();

      if (buildRoads && settlements.length >= 2) {
        showDiceResult('🛤️', '修建道路...');

        setTimeout(() => {
          // Step 3: Build roads
          buildRoadNetwork(settlements);
          render();

          endBatch();

          const stats = Object.keys(hexData).length;
          showStepResult('✅', '生成完成！', `${stats} 格 · ${settlements.length} 定居点`);
          isGenerating = false;
          setGenButtonsDisabled(false);
          updateInfo();
        }, 200);
      } else {
        endBatch();
        const stats = Object.keys(hexData).length;
        showStepResult('✅', '生成完成！', `${stats} 格 · ${settlements.length} 定居点`);
        isGenerating = false;
        setGenButtonsDisabled(false);
        updateInfo();
      }
    }, 200);
  }, 50);
}

  const h = getHex(selectedHex.q, selectedHex.r);

    let roadsBuilt = 0;
    let checked = 0;
    beginBatch();
    for (const [key, data] of Object.entries(hexData)) {
      if (!data.settlement) continue;
      const [oq, or] = key.split(',').map(Number);
      if (oq === selectedHex.q && or === selectedHex.r) continue;
      checked++;
      const dist = hexDistance(selectedHex.q, selectedHex.r, oq, or);
      // Each settlement rolls its own 3d6
      const roll3d6 = Math.floor(Math.random() * 6) + 1
                    + Math.floor(Math.random() * 6) + 1
                    + Math.floor(Math.random() * 6) + 1;
      if (roll3d6 > dist) {
        // Find a path along adjacent hexes and build roads segment by segment
        const path = hexPathfind(selectedHex.q, selectedHex.r, oq, or);
        if (path && path.length > 1) {
          for (let i = 0; i < path.length - 1; i++) {
            addRoad(path[i].q, path[i].r, path[i + 1].q, path[i + 1].r);
          }
          roadsBuilt++;
        }
      }
    }
    endBatch();
    showStepResult('🛤️', `3d6投完`, `检查了${checked}个定居点`, roadsBuilt > 0 ? `发现 ${roadsBuilt} 条道路连接` : '未发现道路');
    render();
    isGenerating = false;
    setGenButtonsDisabled(false);
  });
});

function hexDistance(q1, r1, q2, r2) {
  // Convert to cube
  const x1 = q1, z1 = r1 - (q1 - (q1 & 1)) / 2, y1 = -x1 - z1;
  const x2 = q2, z2 = r2 - (q2 - (q2 & 1)) / 2, y2 = -x2 - z2;
  return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2), Math.abs(z1 - z2));
}

// Export PNG
document.getElementById('btn-export-img').addEventListener('click', () => {
  cleanHexData();
  const keys = Object.keys(hexData);
  if (keys.length === 0) { showDiceResult('⚠️', '没有数据可导出'); return; }
  // Compute bounding box
  let minQ = Infinity, maxQ = -Infinity, minR = Infinity, maxR = -Infinity;
  keys.forEach(k => {
    const [q, r] = k.split(',').map(Number);
    if (q < minQ) minQ = q;
    if (q > maxQ) maxQ = q;
    if (r < minR) minR = r;
    if (r > maxR) maxR = r;
  });
  const topLeft = hexToPixel(minQ, minR);
  const botRight = hexToPixel(maxQ, maxR);
  const size = HEX_SIZE;
  const padding = size * 2;
  const w = Math.ceil(botRight.x - topLeft.x + size * 2 + padding * 2);
  const h = Math.ceil(botRight.y - topLeft.y + size * 1.5 + padding * 2);
  const MAX_EXPORT = 10000;
  if (w > MAX_EXPORT || h > MAX_EXPORT) { showDiceResult('⚠️', '地图太大，缩小后导出'); return; }
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = Math.max(w, 640);
  exportCanvas.height = Math.max(h, 480);
  const exportCtx = exportCanvas.getContext('2d');
  exportCtx.fillStyle = '#2d2d44';
  exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
  const offsetX = (exportCanvas.width - w) / 2 - topLeft.x + padding;
  const offsetY = (exportCanvas.height - h) / 2 - topLeft.y + padding;
  exportCtx.save();
  exportCtx.translate(offsetX, offsetY);
  const allTerrains = getAllTerrains();
  // Draw hex fills + grid (Pass 1)
  for (const key of keys) {
    const [q, r] = key.split(',').map(Number);
    const p = hexToPixel(q, r);
    const corners = hexCorners(p.x, p.y, HEX_SIZE);
    const h = hexData[key];
    exportCtx.beginPath();
    corners.forEach((c, i) => i === 0 ? exportCtx.moveTo(c.x, c.y) : exportCtx.lineTo(c.x, c.y));
    exportCtx.closePath();
    let fillColor = '#3a3a52';
    if (h.terrain && allTerrains[h.terrain]) fillColor = allTerrains[h.terrain].color;
    exportCtx.fillStyle = fillColor;
    exportCtx.fill();
    exportCtx.strokeStyle = 'rgba(255,255,255,0.12)';
    exportCtx.lineWidth = 1;
    exportCtx.stroke();
  }
  // Draw roads (Pass 2)
  exportCtx.strokeStyle = '#8B4513';
  exportCtx.lineWidth = 3;
  for (const key of keys) {
    const h = hexData[key];
    if (h.roads && h.roads.length) {
      const [q1, r1] = key.split(',').map(Number);
      const p1 = hexToPixel(q1, r1);
      for (const rd of h.roads) {
        if (rd.q > q1 || (rd.q === q1 && rd.r > r1)) {
          const p2 = hexToPixel(rd.q, rd.r);
          exportCtx.beginPath();
          exportCtx.moveTo(p1.x, p1.y);
          exportCtx.lineTo(p2.x, p2.y);
          exportCtx.stroke();
        }
      }
    }
  }
  // Draw overlays (Pass 3)
  for (const key of keys) {
    const [q, r] = key.split(',').map(Number);
    const h = hexData[key];
    const p = hexToPixel(q, r);
    // Terrain icon (image or emoji)
    const hOTI = h.terrain ? allTerrains[h.terrain] : null;
    if (hOTI) {
      if (hOTI.imageUrl) {
        const img = getCachedImage(hOTI.imageUrl);
        if (img && img.complete && img.naturalWidth > 0) {
          exportCtx.save();
          const ec = hexCorners(p.x, p.y, HEX_SIZE * 0.6);
          exportCtx.beginPath();
          ec.forEach((c, i) => i === 0 ? exportCtx.moveTo(c.x, c.y) : exportCtx.lineTo(c.x, c.y));
          exportCtx.closePath();
          exportCtx.clip();
          const is = HEX_SIZE * 0.9;
          exportCtx.drawImage(img, p.x - is/2, p.y - (h.label || h.settlement ? HEX_SIZE * 0.3 : 0) - is/2, is, is);
          exportCtx.restore();
        } else {
          exportCtx.fillText(hOTI.icon, p.x, p.y - (h.label || h.settlement ? HEX_SIZE * 0.15 : 0));
        }
      } else {
        exportCtx.font = `${HEX_SIZE * 0.5}px sans-serif`;
        exportCtx.textAlign = 'center';
        exportCtx.textBaseline = 'middle';
        exportCtx.fillStyle = 'rgba(255,255,255,0.85)';
        exportCtx.fillText(hOTI.icon, p.x, p.y - (h.label || h.settlement ? HEX_SIZE * 0.15 : 0));
      }
    }
    // Label
    if (h.label) {
      exportCtx.fillStyle = '#fff';
      exportCtx.font = `bold ${Math.max(9, HEX_SIZE * 0.38)}px sans-serif`;
      exportCtx.textAlign = 'center';
      exportCtx.textBaseline = 'bottom';
      const tw = exportCtx.measureText(h.label).width;
      exportCtx.fillStyle = 'rgba(0,0,0,0.55)';
      exportCtx.fillRect(p.x - tw/2 - 3, p.y - HEX_SIZE * 0.65, tw + 6, HEX_SIZE * 0.55);
      exportCtx.fillStyle = '#fff';
      exportCtx.fillText(h.label, p.x, p.y - HEX_SIZE * 0.2);
    }
    // Settlement
    if (h.settlement) {
      if (h.settlement.imageUrl) {
        const img = getCachedImage(h.settlement.imageUrl);
        if (img && img.complete && img.naturalWidth > 0) {
          exportCtx.save();
          const ec = hexCorners(p.x, p.y + HEX_SIZE * 0.1, HEX_SIZE * 0.5);
          exportCtx.beginPath();
          ec.forEach((c, i) => i === 0 ? exportCtx.moveTo(c.x, c.y) : exportCtx.lineTo(c.x, c.y));
          exportCtx.closePath();
          exportCtx.clip();
          const is = HEX_SIZE * 0.8;
          exportCtx.drawImage(img, p.x - is/2, p.y + HEX_SIZE * 0.1 - is/2, is, is);
          exportCtx.restore();
        } else {
          exportCtx.font = `${HEX_SIZE * 0.6}px sans-serif`;
          exportCtx.textAlign = 'center';
          exportCtx.textBaseline = 'bottom';
          exportCtx.fillText('🏘️', p.x, p.y + HEX_SIZE * 0.45);
        }
      } else {
        exportCtx.font = `${HEX_SIZE * 0.6}px sans-serif`;
        exportCtx.textAlign = 'center';
        exportCtx.textBaseline = 'bottom';
        exportCtx.fillText('🏘️', p.x, p.y + HEX_SIZE * 0.45);
      }
    } // closes if(h.settlement)
  } // closes for loop
  exportCtx.restore();
  const link = document.createElement("a");
  link.download = "hexmap_" + new Date().toISOString().slice(0,10) + ".png";
  link.href = exportCanvas.toDataURL("image/png");
  link.click();
  showDiceResult("🖼️ 已导出", "全地图 " + exportCanvas.width + "x" + exportCanvas.height + " (" + keys.length + " 格)");
});

// --- Settings persistence ---
function loadAISettings() {
  try {
    const raw = localStorage.getItem('ai_draw_settings');
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }

function saveAISettings(settings) {

// --- Map context ---
function getScopeHexes(scope) {
  const keys = Object.keys(hexData);
  if (scope === 'all') return keys;
  if (scope === 'selected') {
    if (selectionRect) {
      // Use box selection
      const q1 = Math.round(selectionRect.x1), r1 = Math.round(selectionRect.y1);
      const q2 = Math.round(selectionRect.x2), r2 = Math.round(selectionRect.y2);      const minQ = Math.min(q1, q2), maxQ = Math.max(q1, q2);
      const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
      return keys.filter(k => {
        const [q, r] = k.split(',').map(Number);
        return q >= minQ && q <= maxQ && r >= minR && r <= maxR;
      });
    }
    if (selectedHex) return [`${selectedHex.q},${selectedHex.r}`];
    return [];
  }
  if (scope === 'view') {
    // Return hexes roughly in current viewport
    const margin = 5;
    const halfW = canvas.width / 2 / zoom + margin;
    const halfH = canvas.height / 2 / zoom + margin;
    return keys.filter(k => {
      const [q, r] = k.split(',').map(Number);
      const px = q * hexWidth * 0.75 + viewX;
      const py = r * hexHeight + (q % 2) * hexHeight / 2 + viewY;
      return px > viewX - halfW * hexWidth && px < viewX + halfW * hexWidth &&
             py > viewY - halfH * hexHeight && py < viewY + halfH * hexHeight;
    });
  }
  return [];
}
function getMapContext(scope) {
  const hexes = getScopeHexes(scope);
  const allTerrains = getAllTerrains?.() || {};
  // Collect unique terrain IDs and their names
  const terrainMap = {};
  for (const [id, info] of Object.entries(allTerrains)) {
    terrainMap[id] = info.name || id;
  }
  const hexList = hexes.map(k => {
    const [q, r] = k.split(',').map(Number);
    const h = hexData[k];
    if (!h) return null;
    const entry = { q, r, terrain: h.terrain || null };
    if (h.label) entry.label = h.label;
    if (h.settlement) entry.settlement = { name: h.settlement.name, rating: h.settlement.rating };
    if (h.roads && h.roads.length) entry.roads = h.roads;
    return entry;
  }).filter(Boolean);
  return {
    hexCount: hexList.length,
    terrains: terrainMap,
    hexes: hexList,
    scope
  };
}
// --- System prompt ---
function buildSystemPrompt() {
  const allT = getAllTerrains?.() || {};
  const terrainDesc = Object.entries(allT).map(([id, info]) =>
    `  - "${id}": ${info.name || id}${info.icon ? ' (' + info.icon + ')' : ''}`
  ).join('\n');
  return `你是地图编辑AI。你通过JSON命令数组来控制六角格地图。

可用地形ID：
${terrainDesc}

命令格式（每行一个JSON对象）：
1. 涂色：{"action":"paint","q":<数字>,"r":<数字>,"terrain":"<地形ID>"}
2. 擦除：{"action":"erase","q":<数字>,"r":<数字>}
3. 标签：{"action":"label","q":<数字>,"r":<数字>,"text":"<文字>"}
4. 定居点：{"action":"settlement","q":<数字>,"r":<数字>,"name":"<名称>","rating":<-3到3的整数>}
5. 道路：{"action":"road","q1":<数字>,"r1":<数字>,"q2":<数字>,"r2":<数字>}
6. 矩形区域涂色：{"action":"paintRect","q1":<数字>,"r1":<数字>,"q2":<数字>,"r2":<数字>,"terrain":"<地形ID>"}

重要规则：
- 坐标 (q, r) 使用 odd-r 六角格系统
- 只输出JSON数组，不要多余文字
- 用 \`\`\`json 包裹你的回复
- paintRect 的 q1/r1 和 q2/r2 定义矩形对角，会自动填充整个矩形区域
- 每次返回完整的命令列表，包含所有需要绘制的格子`;
}
// --- API call ---
async function callAIAPI(systemPrompt, userMessage) {
  const settings = loadAISettings();
  if (!settings.apiKey) throw new Error('请先在AI绘图对话框中填写API Key');
  if (settings.provider === 'anthropic') {
    // Anthropic Messages API
    const endpoint = settings.endpoint || 'https://api.anthropic.com/v1/messages';
    const model = settings.model || 'claude-sonnet-4-20250514';
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': settings.apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model,
        max_tokens: 4096,
        system: systemPrompt,
        messages: [{ role: 'user', content: userMessage }]
      })
    });
    if (!resp.ok) {
      let errText = '';
      try { const e = await resp.json(); errText = JSON.stringify(e); } catch (e) { errText = await resp.text(); }
      throw new Error(`API错误 (${resp.status}): ${errText}`);
    }
    const data = await resp.json();
    return data.content[0].text;
  } else {
    // OpenAI-compatible API
    const isOpenAI = settings.provider === 'openai';
    const defaultEndpoint = isOpenAI ? 'https://api.openai.com/v1/chat/completions' :
                           settings.provider === 'openrouter' ? 'https://openrouter.ai/api/v1/chat/completions' : '';
    const endpoint = settings.endpoint || defaultEndpoint;
    const model = settings.model || (isOpenAI ? 'gpt-4o' : '');
    if (!endpoint) throw new Error('请填写API Endpoint');
    if (!model) throw new Error('请填写模型名称');
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${settings.apiKey}`
      },
      body: JSON.stringify({
        model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userMessage }
        ],
        max_tokens: 4096
      })
    });
    if (!resp.ok) {
      let errText = '';
      try { const e = await resp.json(); errText = JSON.stringify(e); } catch (e) { errText = await resp.text(); }
      throw new Error(`API错误 (${resp.status}): ${errText}`);
    }
    const data = await resp.json();
    return data.choices[0].message.content;
  }
}
// --- Parse AI response ---
function parseAIResponse(text) {
  // Try to extract JSON from code block
  const jsonMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  const jsonStr = jsonMatch ? jsonMatch[1].trim() : text.trim();
  try {
    const parsed = JSON.parse(jsonStr);
    return Array.isArray(parsed) ? parsed : [parsed];
  } catch (e) {
    // Try line-by-line
    const lines = jsonStr.split('\n').filter(l => l.trim().startsWith('{'));
    const commands = [];
    for (const line of lines) {
      try { commands.push(JSON.parse(line)); } catch (e2) { /* skip */ }
    }
    if (commands.length) return commands;
    throw new Error('无法解析AI返回的JSON: ' + jsonStr.slice(0, 200));
  }
}
// --- Execute commands ---
function executeAICommands(commands) {
  let count = 0;
  beginBatch();
  try {
    for (const cmd of commands) {
      const { action, q, r, terrain, text, name, rating, q1, r1, q2, r2 } = cmd;
      if (action === 'paint' && q !== undefined && r !== undefined && terrain) {
        const key = `${q},${r}`;
        pushUndo(key);
        if (!hexData[key]) hexData[key] = {};
        hexData[key].terrain = terrain;
        count++;
      } else if (action === 'erase' && q !== undefined && r !== undefined) {
        const key = `${q},${r}`;
        pushUndo(key);
        delete hexData[key];
        count++;
      } else if (action === 'label' && q !== undefined && r !== undefined && text !== undefined) {
        const key = `${q},${r}`;
        pushUndo(key);
        if (!hexData[key]) hexData[key] = {};
        if (text) hexData[key].label = text;
        else delete hexData[key].label;
        count++;
      } else if (action === 'settlement' && q !== undefined && r !== undefined && name) {
        const key = `${q},${r}`;
        pushUndo(key);
        if (!hexData[key]) hexData[key] = {};
        hexData[key].settlement = { name, rating: rating || 0 };
        count++;
      } else if (action === 'road' && q1 !== undefined && r1 !== undefined && q2 !== undefined && r2 !== undefined) {
        const k1 = `${q1},${r1}`, k2 = `${q2},${r2}`;
        // Add road to both hexes
        for (const [k, a, b] of [[k1, q1, r1], [k2, q2, r2]]) {
          pushUndo(k);
          if (!hexData[k]) hexData[k] = {};
          if (!hexData[k].roads) hexData[k].roads = [];
          // Add if not duplicate
          const exists = hexData[k].roads.some(r => (r.q === q1 && r.r === r1) || (r.q === q2 && r.r === r2));
          if (!exists) hexData[k].roads.push({ q: a === q1 ? q2 : q1, r: a === r1 ? r2 : r1 });
        }
        count++;
      } else if (action === 'paintRect' && q1 !== undefined && r1 !== undefined && q2 !== undefined && r2 !== undefined && terrain) {
        const minQ = Math.min(q1, q2), maxQ = Math.max(q1, q2);
        const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
        for (let qq = minQ; qq <= maxQ; qq++) {
          for (let rr = minR; rr <= maxR; rr++) {
            const key = `${qq},${rr}`;
            pushUndo(key);
            if (!hexData[key]) hexData[key] = {};
            hexData[key].terrain = terrain;
            count++;
          }
        }
      }
    }
  } finally {
    endBatch();
  }
  return count;
}

// --- Event bindings ---
// Open AI dialog
  const btnAI = document.getElementById('btn-ai-draw');
  if (btnAI) {
    btnAI.addEventListener('click', () => {
      const modal = document.getElementById('ai-draw-modal');      if (modal) modal.style.display = 'block';
      // Load saved settings
      const settings = loadAISettings();
      const providerSel = document.getElementById('ai-provider');
      const keyInput = document.getElementById('ai-api-key');
      const endpointInput = document.getElementById('ai-endpoint');
      const modelInput = document.getElementById('ai-model');
      if (providerSel) providerSel.value = settings.provider;
      if (keyInput) keyInput.value = settings.apiKey || '';
      if (endpointInput) endpointInput.value = settings.endpoint || '';
      if (modelInput) modelInput.value = settings.model || '';
      // Trigger provider change to show/hide fields
      if (providerSel) providerSel.dispatchEvent(new Event('change'));
    });
  }
  // Provider switch
  const providerSel = document.getElementById('ai-provider');  if (providerSel) {
    providerSel.addEventListener('change', () => {
      const val = providerSel.value;
      const endpointRow = document.getElementById('ai-endpoint-row');      const modelRow = document.getElementById('ai-model-row');      const epInput = document.getElementById('ai-endpoint');
      const modelInput = document.getElementById('ai-model');
      if (val === 'openai') {
        if (endpointRow) endpointRow.style.display = 'none';
        if (modelRow) modelRow.style.display = 'none';
        if (epInput) epInput.value = '';
        if (modelInput) modelInput.value = 'gpt-4o';
      } else if (val === 'anthropic') {
        if (endpointRow) endpointRow.style.display = 'none';
        if (modelRow) modelRow.style.display = 'block';
        if (epInput) epInput.value = '';
        if (modelInput) modelInput.value = 'claude-sonnet-4-20250514';
      } else if (val === 'openrouter') {
        if (endpointRow) endpointRow.style.display = 'none';
        if (modelRow) modelRow.style.display = 'block';
        if (epInput) epInput.value = '';
        if (modelInput) modelInput.value = '';
      } else { // custom
        if (endpointRow) endpointRow.style.display = 'block';
        if (modelRow) modelRow.style.display = 'block';
      }
    });
  }
  // Toggle API key visibility
  const toggleBtn = document.getElementById('ai-toggle-key');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const input = document.getElementById('ai-api-key');
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
        toggleBtn.textContent = input.type === 'password' ? '👁️' : '🙈';
      }
    });
  }
  // Clear prompt
  const clearBtn = document.getElementById('ai-btn-clear-prompt');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      const ta = document.getElementById('ai-prompt');      if (ta) ta.value = '';
      ta.focus();
    });
  }
  // Add context - insert current map description into prompt
  const contextBtn = document.getElementById('ai-btn-add-context');
  if (contextBtn) {
    contextBtn.addEventListener('click', () => {
      const scopeSel = document.getElementById('ai-scope');      const scope = scopeSel ? scopeSel.value : 'all';
      const context = getMapContext(scope);
      const ta = document.getElementById('ai-prompt');      if (!ta) return;
      const lines = [`[当前地图状态 - 范围: ${scope}]`];
      lines.push(`格子数: ${context.hexCount}`);
      // Group by terrain      const byTerrain = {};
      for (const h of context.hexes) {
        const t = h.terrain || 'unexplored';        if (!byTerrain[t]) byTerrain[t] = [];
        byTerrain[t].push(`(${h.q},${h.r})`);
      }
      for (const [t, coords] of Object.entries(byTerrain)) {
        const name = context.terrains[t] || t;
        lines.push(`${name}: ${coords.join(' ')}`);
      }
      // Settlements
      const settls = context.hexes.filter(h => h.settlement);
      if (settls.length) {
        lines.push('定居点:');
        for (const h of settls) {
          lines.push(`  (${h.q},${h.r}) ${h.settlement.name} (${h.settlement.rating >= 0 ? '+' : ''}${h.settlement.rating})`);
        }
      }
      ta.value = (ta.value ? ta.value + '\n\n' : '') + lines.join('\n');
    });
  }
  // Confirm (execute AI generation)
  const confirmBtn = document.getElementById('ai-btn-confirm');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', async () => {
      // Gather settings
      const provider = document.getElementById('ai-provider').value;
      const apiKey = document.getElementById('ai-api-key').value;
      const endpoint = document.getElementById('ai-endpoint').value;
      const model = document.getElementById('ai-model').value;
      const scope = document.getElementById('ai-scope').value;
      const prompt = document.getElementById('ai-prompt').value;
      if (!apiKey) { alert('请填写API Key'); return; }
      if (!prompt) { alert('请填写你的需求'); return; }
      // Save settings
      saveAISettings({ provider, apiKey, endpoint, model });
      // Build messages
      const mapContext = getMapContext(scope);
      const systemPrompt = buildSystemPrompt();
      const userMessage = `当前地图范围: ${scope}\n格子数: ${mapContext.hexCount}\n\n用户需求:\n${prompt}`;
      // Status display
      const statusDiv = document.getElementById('ai-status');
      if (statusDiv) {
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = '<span style="color:#a044ff;">⏳ AI 思考中...</span>';
      }
      confirmBtn.disabled = true;
      confirmBtn.textContent = '⏳ 生成中...';
      try {
        const respText = await callAIAPI(systemPrompt, userMessage);
        if (statusDiv) {
          statusDiv.innerHTML = '<span style="color:#4ecdc4;">✅ AI 响应已获取，解析中...</span>';
        }
        const commands = parseAIResponse(respText);
        if (statusDiv) {
          statusDiv.innerHTML = `<span style="color:#4ecdc4;">✅ 解析到 ${commands.length} 条命令，执行中...</span>`;
        }
        const count = executeAICommands(commands);
        render();
        updateInfo();
        if (statusDiv) {
          statusDiv.innerHTML = `<span style="color:#4ecdc4;">✅ 完成！共执行 ${count} 条命令</span>`;
          setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
        }
      } catch (err) {
        if (statusDiv) {
          statusDiv.innerHTML = `<span style="color:#e94560;">❌ 错误: ${err.message}</span>`;
        }
        console.error('AI Draw Error:', err);
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.textContent = '🤖 开始生成';
      }
    });
  }
  // Cancel
  const cancelBtn = document.getElementById('ai-btn-cancel');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', () => {
      const modal = document.getElementById('ai-draw-modal');
      if (modal) modal.style.display = 'none';
    });
  }
</script>
