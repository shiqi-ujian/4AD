# chmweb.cn — CHM 转换器（反代本地 8080）+ www 重定向
# map.chmweb.cn — 4AD 地图工具站（静态）
# HTTPS 由 certbot --nginx 追加（先 HTTP 跑通再签发）

# ---------- chmweb.cn → chm-web 服务 ----------
server {
    server_name chmweb.cn;

    # 上传的 CHM 可能较大（应用层另有配额限制）
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 批量上传 + 转换耗时较长，放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chmweb.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chmweb.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---------- www.chmweb.cn → 301 到主域 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.chmweb.cn;
    ssl_certificate /etc/letsencrypt/live/chmweb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chmweb.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://chmweb.cn$request_uri;
}

# ---------- map.chmweb.cn → 地图工具站（静态） ----------
server {
    server_name map.chmweb.cn;

    root /var/www/chmweb/map;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # 目录 URL（如 /combatmap/）内部转 index.html，同样不缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # HTML 入口页每次部署都会变 → 不缓存，每次回源校验（避免旧版本卡缓存）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # 其余静态资产可长期缓存（地图工具为单文件应用，此站基本只有 HTML）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chmweb.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chmweb.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---------- HTTP → HTTPS ----------
server {
    if ($host = www.chmweb.cn) {
        return 301 https://chmweb.cn$request_uri;
    } # managed by Certbot

    if ($host = chmweb.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name chmweb.cn www.chmweb.cn;
    return 404; # managed by Certbot
}

server {
    if ($host = map.chmweb.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name map.chmweb.cn;
    return 404; # managed by Certbot
}
