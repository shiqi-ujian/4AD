<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>4AD 地牢房间目录编辑器</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f0; margin: 0; display: flex; height: 100vh; }

  /* ===== 左侧导航 ===== */
  .sidebar {
    width: 280px; min-width: 280px; background: #e0dcd0; border-right: 2px solid #333;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 12px; background: #d0ccbe; border-bottom: 1px solid #aaa;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;
  }
  .sidebar-header h2 { margin: 0; font-size: 15px; }
  .sidebar-header .btn { font-size: 11px; padding: 3px 8px; }
  .room-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .section-title {
    padding: 6px 12px; font-size: 12px; color: #666; font-weight: bold;
    background: #d8d4c6; cursor: pointer; user-select: none; display: flex; justify-content: space-between;
  }
  .section-title:hover { background: #d0ccbe; }
  .room-item {
    padding: 6px 12px 6px 20px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent;
  }
  .room-item:hover { background: #d8d4c6; }
  .room-item.active { background: #c8c0ae; border-left-color: #d32f2f; font-weight: bold; }
  .room-item .name { flex: 1; }
  .room-item .badge { font-size: 10px; color: #888; margin-left: 6px; }
  .room-item .del-btn {
    font-size: 14px; color: #c0392b; cursor: pointer; opacity: 0; margin-left: 4px; line-height: 1;
  }
  .room-item:hover .del-btn { opacity: .5; }
  .room-item .del-btn:hover { opacity: 1; }

  /* ===== 右侧编辑区 ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-header {
    padding: 10px 20px; background: #e8e4d9; border-bottom: 2px solid #333;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .main-header input[type="text"] {
    border: 1px solid #aaa; border-radius: 4px; padding: 4px 8px; font-size: 14px;
    background: #fff; width: 160px;
  }
  .main-header input.desc { width: 240px; font-size: 12px; color: #555; }
  .main-header .spacer { flex: 1; }

  .editor-body {
    flex: 1; display: flex; gap: 20px; padding: 16px 20px; overflow: auto; align-items: flex-start;
  }

  /* 调色板 */
  .palette { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tool-btn {
    width: 48px; height: 38px; border: 2px solid #aaa; border-radius: 5px;
    cursor: pointer; font-size: 12px; text-align: center; line-height: 1.1;
    background: #fff; transition: all .12s; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .tool-btn:hover { border-color: #666; }
  .tool-btn.active { border-color: #d32f2f; background: #ffe0e0; box-shadow: 0 0 5px rgba(211,47,47,.4); }
  .tool-btn .char { font-size: 16px; font-weight: bold; }
  .tool-btn .label { font-size: 9px; color: #666; }

  /* 网格 */
  .grid-wrap { display: inline-block; background: #e8e4d9; padding: 10px; border-radius: 6px; border: 2px solid #333; }
  table.grid { border-collapse: collapse; }
  table.grid td {
    width: 34px; height: 34px; border: 1px solid #999;
    text-align: center; font-size: 14px; font-weight: bold;
    cursor: pointer; user-select: none;
  }
  table.grid td:hover { opacity: .8; }

  .cell-wall { background: #444; color: #888; }
  .cell-floor { background: #d4c9a8; color: #666; }
  .cell-door { background: #8B4513; color: #fff; }
  .cell-trap { background: #ff6b35; color: #fff; }
  .cell-monster { background: #c0392b; color: #fff; }
  .cell-treasure { background: #f1c40f; color: #333; }
  .cell-player { background: #2e86de; color: #fff; }
  .cell-stairs { background: #8e44ad; color: #fff; }
  .cell-altar { background: #e67e22; color: #fff; }
  .cell-water { background: #5dade2; color: #fff; }
  .cell-unknown { background: #bbb; color: #666; }

  .right-col { min-width: 200px; }
  .right-col .output-box {
    background: #fff; border: 2px solid #333; border-radius: 6px;
    padding: 8px; font-family: 'Courier New', monospace; font-size: 12px;
    line-height: 1.35; min-height: 120px; max-height: 300px; overflow: auto;
    white-space: pre; user-select: all;
  }
  .legend { font-size: 11px; margin-bottom: 8px; }
  .legend span { display: inline-block; margin: 1px 4px 1px 0; }
  .legend .swatch { display: inline-block; width: 16px; height: 16px; border: 1px solid #aaa; vertical-align: middle; text-align: center; line-height: 16px; font-size: 10px; font-weight: bold; margin-right: 1px; }
  .copy-msg { color: #27ae60; font-size: 12px; opacity: 0; transition: opacity .3s; margin-left: 8px; }
  .copy-msg.show { opacity: 1; }

  .btn {
    padding: 5px 12px; border: 1px solid #888; border-radius: 4px;
    background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .btn:hover { background: #eee; }
  .btn-sm { padding: 3px 8px; font-size: 11px; }
  .btn-primary { background: #2e86de; color: #fff; border-color: #2471a3; }
  .btn-primary:hover { background: #2471a3; }
  .btn-danger { background: #c0392b; color: #fff; border-color: #a93226; }
  .btn-danger:hover { background: #a93226; }
  .btn-success { background: #27ae60; color: #fff; border-color: #1e8449; }
  .btn-success:hover { background: #1e8449; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .controls label { font-size: 12px; }
  .controls input[type="number"] { width: 44px; border: 1px solid #aaa; border-radius: 3px; padding: 2px; font-size: 12px; text-align: center; }
  .dirty-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e67e22; margin-left: 6px; }
</style>
</head>
<body>

<!-- ===== 左侧导航 ===== -->
<div class="sidebar">
  <div class="sidebar-header">
    <h2>🏰 房间目录</h2>
    <div style="display:flex;gap:4px">
      <button class="btn btn-sm" onclick="addRoom()">+ 新建</button>
    </div>
  </div>
  <div style="padding:4px 12px;display:flex;gap:4px">
    <button class="btn btn-sm btn-primary" onclick="exportCatalog()">导出全部</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
    <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">导入</button>
    <button class="btn btn-sm" onclick="resetCatalog()" style="color:#999;font-size:10px">重置</button>
  </div>
  <div class="room-list" id="roomList"></div>
</div>

<!-- ===== 右侧编辑区 ===== -->
<div class="main">
  <div class="main-header">
    <span style="font-size:13px;color:#888">当前:</span>
    <input type="text" id="roomNameInput" placeholder="房间名称" oninput="onRoomFieldChange()">
    <input type="text" class="desc" id="roomDescInput" placeholder="描述（可选）" oninput="onRoomFieldChange()">
    <span class="spacer"></span>
    <button class="btn btn-sm" onclick="exportSingleRoom()">导出当前</button>
    <span id="dirtyDot" class="dirty-dot" style="display:none" title="有未保存的更改"></span>
  </div>

  <div class="editor-body">
    <div>
      <div class="palette" id="palette"></div>
      <div class="grid-wrap">
        <table class="grid" id="grid"></table>
      </div>
      <div class="controls">
        <label>行: <input type="number" id="rowsInput" value="8" onchange="onResizeFromInput()"></label>
        <label>列: <input type="number" id="colsInput" value="9" onchange="onResizeFromInput()"></label>
        <button class="btn btn-sm" onclick="fillAll('floor')">全地板</button>
        <button class="btn btn-sm" onclick="fillAll('wall')">全墙</button>
        <button class="btn btn-sm" onclick="clearCurrentGrid()">清空</button>
      </div>
    </div>

    <div class="right-col">
      <div class="legend" id="legendBox"></div>
      <div style="font-size:12px;color:#888;margin-bottom:4px">📋 字符文本（可复制）</div>
      <div class="output-box" id="outputBox"></div>
      <div style="margin-top:6px">
        <button class="btn btn-sm btn-primary" onclick="copyOutput()">📋 复制</button>
        <span class="copy-msg" id="copyMsg">✓ 已复制</span>
        <span style="font-size:11px;color:#aaa;margin-left:8px">左键画 · 右键擦 · 拖拽批量</span>
      </div>
    </div>
  </div>
</div>

<script>
// ======== 地形类型 ========
const TERRAIN = [
  { id:'wall',     ch:'x', label:'墙',   color:'#444' },
  { id:'floor',    ch:'.', label:'地',   color:'#d4c9a8' },
  { id:'door',     ch:'D', label:'门',   color:'#8B4513' },
  { id:'trap',     ch:'T', label:'陷',   color:'#ff6b35' },
  { id:'monster',  ch:'M', label:'怪',   color:'#c0392b' },
  { id:'treasure', ch:'@', label:'宝',   color:'#f1c40f' },
  { id:'player',   ch:'P', label:'玩',   color:'#2e86de' },
  { id:'stairs',   ch:'S', label:'梯',   color:'#8e44ad' },
  { id:'altar',    ch:'A', label:'坛',   color:'#e67e22' },
  { id:'water',    ch:'~', label:'水',   color:'#5dade2' },
  { id:'unknown',  ch:'?', label:'?',    color:'#bbb' },
];
const TMAP = {}; TERRAIN.forEach(t => TMAP[t.id]=t);

// ======== 房间目录结构 ========
// {
//   sections: [
//     { title: "第24页 - 房间样式 1-6",
//       rooms: [
//         { id: "r1", name:"Room 1", desc:"小型标准矩形", rows:8, cols:9, grid:[["floor",...],...] }
//       ]
//     }
//   ],
//   nextId: 1
// }

const DEFAULT_ROWS = 8, DEFAULT_COLS = 9;
const STORAGE_KEY = '4ad_room_catalog';

let catalog = loadCatalog();
let currentRoomId = null;  // room.id
let activeTool = 'wall';
let dirty = false;

// ======== 初始数据 ========
function getDefaultCatalog() {
  return {
    sections: [
      { title: "新建房间", rooms: [] }
    ],
    nextId: 1
  };
}

// ======== 加载/保存 ========
function loadCatalog() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const c = JSON.parse(raw);
      // 确保 sections 存在
      if (!c.sections) c.sections = [{ title: "新建房间", rooms: [] }];
      if (!c.nextId) c.nextId = c.sections.reduce((m, s) => Math.max(m, s.rooms.reduce((mm, r) => Math.max(mm, parseInt(r.id.slice(1))||0), 0)), 0) + 1;
      return c;
    }
  } catch(e) { console.warn('Load failed', e); }
  return getDefaultCatalog();
}

function saveCatalog() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog));
}

// ======== 房间 CRUD ========
function genId() {
  return 'r' + (catalog.nextId++);
}

function findRoom(id) {
  for (const s of catalog.sections)
    for (const r of s.rooms)
      if (r.id === id) return r;
  return null;
}

function findSectionByRoom(id) {
  for (const s of catalog.sections)
    if (s.rooms.some(r => r.id === id)) return s;
  return null;
}

function createEmptyRoom(name) {
  const grid = [];
  for (let i = 0; i < DEFAULT_ROWS; i++) {
    grid[i] = [];
    for (let j = 0; j < DEFAULT_COLS; j++) grid[i][j] = 'floor';
  }
  return {
    id: genId(),
    name: name || '新房间',
    desc: '',
    rows: DEFAULT_ROWS,
    cols: DEFAULT_COLS,
    grid
  };
}

function addRoom(name) {
  if (!name) {
    name = prompt('房间名称：', '新房间');
    if (!name) return; // 用户取消
  }
  const room = createEmptyRoom(name);
  // 加到"我的标注" section
  let mySection = catalog.sections.find(s => s.title === '✏️ 我的标注');
  if (!mySection) {
    mySection = { title: '✏️ 我的标注', rooms: [] };
    catalog.sections.unshift(mySection);
  }
  mySection.rooms.push(room);
  saveCatalog();
  renderRoomList();
  selectRoom(room.id);
  markDirty();
}

// ======== 选中 & 渲染 ========
function selectRoom(id) {
  currentRoomId = id;
  const room = findRoom(id);
  if (!room) return;
  document.getElementById('roomNameInput').value = room.name;
  document.getElementById('roomDescInput').value = room.desc || '';
  document.getElementById('rowsInput').value = room.rows;
  document.getElementById('colsInput').value = room.cols;
  renderGridForRoom(room);
  updateOutput();
  renderRoomList(); // 高亮
}

function renderRoomList() {
  const el = document.getElementById('roomList');
  let html = '';
  for (const sec of catalog.sections) {
    if (sec.rooms.length === 0) continue;
    html += `<div class="section-title">${sec.title} <span style="font-size:11px;color:#999">${sec.rooms.length}</span></div>`;
    for (const r of sec.rooms) {
      const active = r.id === currentRoomId ? 'active' : '';
      html += `<div class="room-item ${active}" onclick="selectRoom('${r.id}')">
        <span class="name">${escHtml(r.name)}</span>
        <span class="badge">${r.rows}×${r.cols}</span>
        <span class="del-btn" onclick="event.stopPropagation();deleteRoom('${r.id}')" title="删除">×</span>
      </div>`;
    }
  }
  el.innerHTML = html || '<div style="padding:20px;text-align:center;color:#888;font-size:13px">暂无房间<br><button class="btn btn-sm" style="margin-top:8px" onclick="addRoom()">+ 创建第一个</button></div>';
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ======== 网格渲染 ========
function renderGridForRoom(room) {
  const el = document.getElementById('grid');
  let html = '';
  for (let r = 0; r < room.rows; r++) {
    html += '<tr>';
    for (let c = 0; c < room.cols; c++) {
      const tid = room.grid[r][c] || 'floor';
      const t = TMAP[tid];
      html += `<td class="cell-${tid}" data-r="${r}" data-c="${c}"
                    onmousedown="paintStart(event, ${r}, ${c})"
                    onmouseenter="paintDrag(event, ${r}, ${c})">${t.ch}</td>`;
    }
    html += '</tr>';
  }
  el.innerHTML = html;
}

// ======== 绘制 ========
let isPainting = false;
let paintMode = null; // 'paint' or 'erase'

function paintStart(e, r, c) {
  e.preventDefault();
  isPainting = true;
  const room = findRoom(currentRoomId);
  if (!room) return;
  if (e.button === 2) { // 右键 = 擦除
    paintMode = 'erase';
    room.grid[r][c] = 'floor';
  } else {
    paintMode = 'paint';
    room.grid[r][c] = activeTool;
  }
  updateCell(room, r, c);
  updateOutput();
  markDirty();
}

function paintDrag(e, r, c) {
  if (!isPainting) return;
  const room = findRoom(currentRoomId);
  if (!room) return;
  if (paintMode === 'erase') {
    room.grid[r][c] = 'floor';
  } else {
    room.grid[r][c] = activeTool;
  }
  updateCell(room, r, c);
  updateOutput();
  markDirty();
}

document.addEventListener('mouseup', () => {
  if (isPainting) {
    isPainting = false;
    paintMode = null;
    saveCatalog();
  }
});
document.addEventListener('contextmenu', e => e.preventDefault());

function updateCell(room, r, c) {
  const td = document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  if (!td) return;
  const tid = room.grid[r][c] || 'floor';
  const t = TMAP[tid];
  td.className = `cell-${tid}`;
  td.textContent = t.ch;
}

// ======== 输出 ========
function generateTextForRoom(room) {
  const lines = [];
  for (let r = 0; r < room.rows; r++) {
    const cells = [];
    for (let c = 0; c < room.cols; c++) {
      const tid = room.grid[r][c] || 'floor';
      cells.push(TMAP[tid].ch);
    }
    lines.push(cells.join(''));
  }
  return lines.join('\n');
}

function updateOutput() {
  const room = findRoom(currentRoomId);
  document.getElementById('outputBox').textContent = room ? generateTextForRoom(room) : '';
}

function copyOutput() {
  const text = document.getElementById('outputBox').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copyMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  }).catch(() => {
    const el = document.getElementById('outputBox');
    const r = document.createRange(); r.selectNode(el);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
    document.execCommand('copy');
  });
}

// ======== 控制 ========
function onResizeFromInput() {
  const room = findRoom(currentRoomId);
  if (!room) return;
  const nr = parseInt(document.getElementById('rowsInput').value) || 3;
  const nc = parseInt(document.getElementById('colsInput').value) || 3;
  const newGrid = [];
  for (let r = 0; r < nr; r++) {
    newGrid[r] = [];
    for (let c = 0; c < nc; c++) {
      newGrid[r][c] = (r < room.rows && c < room.cols) ? room.grid[r][c] : 'floor';
    }
  }
  room.rows = nr; room.cols = nc;
  room.grid = newGrid;
  renderGridForRoom(room);
  updateOutput();
  markDirty();
}

function fillAll(type) {
  const room = findRoom(currentRoomId);
  if (!room) return;
  for (let r = 0; r < room.rows; r++)
    for (let c = 0; c < room.cols; c++)
      room.grid[r][c] = type;
  renderGridForRoom(room);
  updateOutput();
  markDirty();
}

function clearCurrentGrid() {
  if (!confirm('清空当前房间格子？')) return;
  fillAll('floor');
}

function deleteRoom(id) {
  const room = findRoom(id);
  if (!room) return;
  if (!confirm(`删除 "${room.name}"？不可恢复。`)) return;
  const sec = findSectionByRoom(id);
  if (sec) {
    sec.rooms = sec.rooms.filter(r => r.id !== id);
  }
  saveCatalog();
  // 切换到下一个可用房间
  let nextRoom = null;
  for (const s of catalog.sections) {
    if (s.rooms.length > 0) { nextRoom = s.rooms[0]; break; }
  }
  renderRoomList();
  if (nextRoom) selectRoom(nextRoom.id);
  else { currentRoomId = null; document.getElementById('grid').innerHTML = ''; document.getElementById('outputBox').textContent = ''; document.getElementById('roomNameInput').value = ''; document.getElementById('roomDescInput').value = ''; }
}

function onRoomFieldChange() {
  const room = findRoom(currentRoomId);
  if (!room) return;
  room.name = document.getElementById('roomNameInput').value || '未命名';
  room.desc = document.getElementById('roomDescInput').value;
  renderRoomList();
  markDirty();
}

// ======== 调色板 ========
function renderPalette() {
  const el = document.getElementById('palette');
  el.innerHTML = TERRAIN.map(t =>
    `<div class="tool-btn ${activeTool===t.id?'active':''}" onclick="selectTool('${t.id}')">
      <div class="char" style="color:${t.color}">${t.ch}</div>
      <div class="label">${t.label}</div>
    </div>`
  ).join('');
}
function selectTool(id) { activeTool = id; renderPalette(); }

// ======== 图例 ========
function renderLegend() {
  const el = document.getElementById('legendBox');
  el.innerHTML = '<strong>图例:</strong> ';
  TERRAIN.forEach(t => {
    el.innerHTML += `<span><span class="swatch" style="background:${t.color};color:${t.id==='floor'?'#666':'#fff'}">${t.ch}</span>${t.label}</span>`;
  });
}

// ======== 脏标记 ========
function markDirty() {
  dirty = true;
  document.getElementById('dirtyDot').style.display = 'inline-block';
}
function clearDirty() {
  dirty = false;
  document.getElementById('dirtyDot').style.display = 'none';
}
// 保存时清除脏标记

// ======== 导出/导入 ========
function exportCatalog() {
  const blob = new Blob([JSON.stringify(catalog, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `4ad_rooms_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportSingleRoom() {
  const room = findRoom(currentRoomId);
  if (!room) return;
  const blob = new Blob([JSON.stringify(room, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${room.name.replace(/[\\/:*?"<>|]/g, '_')}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      // 判断是目录还是单个房间
      if (data.sections) {
        // 合入现有目录
        for (const sec of data.sections) {
          const existing = catalog.sections.find(s => s.title === sec.title);
          if (existing) {
            // 合并房间，避免 id 冲突
            for (const r of sec.rooms) {
              if (!r.id) r.id = genId();
              if (existing.rooms.some(er => er.id === r.id)) r.id = genId();
              existing.rooms.push(r);
            }
          } else {
            // 确保所有房间有 id
            for (const r of sec.rooms) { if (!r.id) r.id = genId(); }
            catalog.sections.push(sec);
          }
        }
      } else if (data.grid) {
        // 单个房间
        if (!data.id) data.id = genId();
        if (!data.rows) data.rows = data.grid.length;
        if (!data.cols) data.cols = data.grid[0].length;
        catalog.sections[0].rooms.push(data);
      }
      saveCatalog();
      renderRoomList();
      if (data.sections) selectRoom(data.sections[0]?.rooms?.[0]?.id);
      else selectRoom(data.id);
    } catch(err) { alert('导入失败: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ======== 将旧数据（o/x/?格式）转为新格式 ========
function convertOldGrid(oldGrid) {
  const rows = oldGrid.length;
  const cols = oldGrid[0].length;
  const newGrid = [];
  for (let r = 0; r < rows; r++) {
    newGrid[r] = [];
    for (let c = 0; c < cols; c++) {
      const ch = oldGrid[r][c];
      if (ch === 'x' || ch === 'X') newGrid[r][c] = 'wall';
      else if (ch === 'o') newGrid[r][c] = 'floor';
      else if (ch === '?') newGrid[r][c] = 'unknown';
      else newGrid[r][c] = 'floor';
    }
  }
  return newGrid;
}

// ======== 重置 ========
function resetCatalog() {
  if (!confirm('重置将丢失所有标注数据，恢复为初始模板。确定？')) return;
  localStorage.removeItem(STORAGE_KEY);
  catalog = loadBuiltinTemplates();
  saveCatalog();
  currentRoomId = null;
  renderRoomList();
  renderPalette();
  renderLegend();
  if (catalog.sections.length > 0 && catalog.sections[0].rooms.length > 0) {
    selectRoom(catalog.sections[0].rooms[0].id);
  }
  clearDirty();
}

// ======== 启动 ========
function init() {
  // 如果 localStorage 没有数据，加载内置模板
  if (!localStorage.getItem(STORAGE_KEY)) {
    catalog = loadBuiltinTemplates();
    saveCatalog();
  }
  catalog = loadCatalog(); // 重新加载确保一致
  renderPalette();
  renderLegend();
  renderRoomList();
  // 选中第一个有房间的 section 的第一个房间
  let firstRoom = null;
  for (const s of catalog.sections) {
    if (s.rooms.length > 0) { firstRoom = s.rooms[0]; break; }
  }
  if (firstRoom) {
    selectRoom(firstRoom.id);
  } else {
    addRoom("示例房间");
  }
  clearDirty();
}
